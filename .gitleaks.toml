# Gitleaks 自定义规则，叠加在内置规则之上。
# 重点防御历史泄露过的字符串以及本仓库常见的几类凭据。
# 文档：https://github.com/gitleaks/gitleaks

title = "amber gitleaks config"

[extend]
useDefault = true

# ===== 项目专属规则 =====

[[rules]]
id = "amber-hardcoded-mysql-password"
description = "硬编码的 MySQL 密码字面量"
regex = '''(?i)password\s*[=:]\s*['"][^'"]{6,}['"]'''
tags = ["password", "mysql"]
[rules.allowlist]
description = "允许 task_schedule 文档中的示例参数"
paths = [
    '''framework/task_schedule/README\.md''',
    '''framework/qsync/docs/.*''',
]

[[rules]]
id = "amber-hardcoded-jdbc-url"
description = "JDBC/mysql URL 中带明文用户名密码"
regex = '''(jdbc:mysql|mysql\+pymysql|postgres(ql)?|mongodb)://[^\s'"]+:[^\s'"@]+@'''
tags = ["jdbc", "connection-string"]

[[rules]]
id = "amber-dashscope-key"
description = "阿里云 DashScope / 通义千问 API Key"
regex = '''sk-[a-zA-Z0-9]{10,}'''
tags = ["api-key", "dashscope"]

[[rules]]
id = "amber-aliyun-ak"
description = "阿里云 AccessKey"
regex = '''LTAI[a-zA-Z0-9]{12,20}'''
tags = ["api-key", "aliyun"]

[[rules]]
id = "amber-tushare-token"
description = "Tushare token 明文"
regex = '''(?i)(tushare[_-]?token|TS_TOKEN)\s*[=:]\s*['"][a-f0-9]{20,}['"]'''
tags = ["token", "tushare"]

# ===== 历史已泄露字符串：永远禁止再出现 =====

[[rules]]
id = "amber-historic-leaked-strings"
description = "历史已经泄露过的密钥/密码字符串，禁止再次出现"
regex = '''(7\$2%s2WLkU8!|RR5wl\.23|cvF4c7Zy!D9w|njV&@JnTD6M%|c99ecff|sk-d14b062742cd|pass123|secret456)'''
tags = ["historic-leak"]

# ===== 全局允许清单 =====

[allowlist]
description = "全局放行项"
paths = [
    '''\.gitleaks\.toml''',
    '''\.pre-commit-config\.yaml''',
    '''(^|/)CLAUDE\.md$''',
]
regexes = [
    # task_schedule 文档里使用 0.0.0.0 / 127.0.0.1 等占位
    '''0\.0\.0\.0''',
    '''127\.0\.0\.1''',
    # 占位符
    '''your[._-]?(email|password|api[_-]?key|token)''',
    '''example\.com''',
    '''<your-[a-z]+>''',
    '''XXXX+''',
]
